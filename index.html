<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Group Locator</title>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuTtPhCKTfi-9Oo3qKdckV6fS6nt5I1H4&libraries=places"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #f5f7fb; }
    #step1 { position: fixed; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 10; background: #f5f7fb; }
    .card { width: 90%; max-width: 400px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    input { width: 100%; padding: 15px; font-size: 16px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
    button { margin-top: 20px; width: 100%; padding: 15px; background: #4f46e5; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
    #map { position: fixed; width: 100%; height: 100%; display: none; }
    #panel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: white; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); display: none; z-index: 100; padding: 20px; box-sizing: border-box; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .close-btn { background: #eee; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; padding: 7px; }
    .panel-link { display: block; padding: 15px; margin-top: 10px; background: #f0f2f5; color: #4f46e5; text-decoration: none; border-radius: 10px; text-align: center; font-weight: 500; }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 200; }
  </style>
</head>
<body>

<div id="step1">
  <div class="card">
    <h2>Find a Group</h2>
    <input id="address" type="text" placeholder="Enter your address...">
    <br><br><br>
    <button onclick="goToMap()">View Nearby Groups</button>
  </div>
</div>

<div id="loader">Loading groups...</div>
<div id="map"></div>

<div id="panel">
  <div class="panel-header">
    <h3 id="title" style="margin:0"></h3>
    <button class="close-btn" onclick="closePanel()">✕</button>
  </div>
  <a id="addressLink" class="panel-link" target="_blank"></a>
  <a id="phoneLink" class="panel-link"></a>
</div>

<script>
let selectedPlace;
let map;
const API_URL = "https://script.google.com/macros/s/AKfycbzEOFkrh9MuJChAnfVZXAzBAUmO-WrMQ3wGq6l80gjGRRno79tVEZvdkzTrvackh1NX/exec"; 

function initAutocomplete() {
  const input = document.getElementById("address");
  const autocomplete = new google.maps.places.Autocomplete(input);
  autocomplete.addListener("place_changed", () => {
    selectedPlace = autocomplete.getPlace();
  });
}

window.onload = initAutocomplete;

function goToMap() {
  if (!selectedPlace || !selectedPlace.geometry) {
    alert("Please select an address from the dropdown list.");
    return;
  }
  document.getElementById("step1").style.display = "none";
  document.getElementById("map").style.display = "block";
  document.getElementById("loader").style.display = "flex";
  initMap();
}

function initMap() {
  const userLoc = selectedPlace.geometry.location;
  map = new google.maps.Map(document.getElementById("map"), {
    center: userLoc,
    zoom: 12,
    disableDefaultUI: true,
    zoomControl: true
  });

  new google.maps.Marker({
    position: userLoc,
    map: map,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 10,
      fillColor: "#4f46e5",
      fillOpacity: 1,
      strokeWeight: 2,
      strokeColor: "white"
    }
  });

  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      document.getElementById("loader").style.display = "none";
      data.forEach(loc => {
        const marker = new google.maps.Marker({
          position: { lat: parseFloat(loc.lat), lng: parseFloat(loc.lng) },
          map: map
        });
        marker.addListener("click", () => openPanel(loc));
      });
    })
    .catch(err => {
      console.error("Fetch error:", err);
      document.getElementById("loader").style.display = "none";
    });
}

function openPanel(loc) {
  document.getElementById("panel").style.display = "block";
  document.getElementById("title").innerText = loc.name;
  document.getElementById("addressLink").innerText = "📍 " + loc.address;
  document.getElementById("addressLink").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(loc.address);
  document.getElementById("phoneLink").innerText = "📞 " + loc.contact;
  document.getElementById("phoneLink").href = "tel:" + loc.contact.replace(/\D/g,'');
}

function closePanel() {
  document.getElementById("panel").style.display = "none";
}
</script>
</body>
</html>
