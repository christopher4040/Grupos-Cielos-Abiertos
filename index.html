<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Group Locator</title>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuTtPhCKTfi-9Oo3qKdckV6fS6nt5I1H4&libraries=places"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background: #f5f7fb; }
    #step1 { position: fixed; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 10; background: #f5f7fb; }
    .card { width: 90%; max-width: 400px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; margin: 16px;}
    input { width: 100%; padding: 15px; font-size: 16px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
    button.primary-btn { width: 100%; padding: 15px; background: #4f46e5; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
    
    #map { position: fixed; width: 100%; height: 100%; display: none; }
    
    /* New Modal Design */
    #panel { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none; z-index: 100; overflow: hidden; }
    .panel-img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
    .panel-body { padding: 20px; }
    .panel-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .close-btn { background: rgba(0,0,0,0.1); border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    /* Collapsible Info */
    .info-header { margin: 15px 0 5px; font-weight: bold; color: #444; cursor: pointer; display: flex; justify-content: space-between; }
    /* The text container limited to 4 lines */
    #infoText { 
      color: #666; 
      font-size: 14px; 
      line-height: 1.5; 
      margin: 10px 0 5px;
      display: -webkit-box;
      -webkit-line-clamp: 4; 
      -webkit-box-orient: vertical;  
      overflow: hidden;
    }
    
    /* When expanded, show all text */
    #infoText.expanded {
      display: block;
      -webkit-line-clamp: none;
    }
    
    /* The "Read more" button style */
    .read-more-btn {
      color: #4f46e5;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      display: block;
      text-align: left;
    }
    
    .button-group { display: flex; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; justify-content: center;}
    .panel-link { padding: 12px; background: #f0f2f5; color: #4f46e5; text-decoration: none; border-radius: 12px; text-align: center; font-weight: 600; font-size: 14px; }
    .dir-link { background: #4f46e5; color: white; padding: 12px 24px;}

    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 200; }
  </style>
</head>
<body>

<div id="step1">
  <div class="card">
    <h2>Encuentra un Grupo</h2>
    <input id="address" type="text" placeholder="Enter your address...">
    <br><br>
    <button class="primary-btn" onclick="goToMap()">View Nearby Groups</button>
  </div>
</div>

<div id="loader">Loading...</div>
<div id="map"></div>

<div id="panel">
  <img id="groupPhoto" class="panel-img" src="" alt="Group Image">
  <div class="panel-body">
    <div class="panel-header">
      <h2 id="title" style="margin:0; font-size: 20px;"></h2>
    </div>

    <div class="info-container">
      <div id="infoText"></div>
      <button id="toggleBtn" class="read-more-btn" onclick="toggleInfo()">Read more</button>
    </div>

    <div class="button-group">
      <a id="refLink" class="panel-link dir-link" target="_blank">More Info</a>
    </div>
  </div>
</div>

<script>
let selectedPlace, map;
const API_URL = "https://script.google.com/macros/s/AKfycbzEOFkrh9MuJChAnfVZXAzBAUmO-WrMQ3wGq6l80gjGRRno79tVEZvdkzTrvackh1NX/exec"; 

function initAutocomplete() {
  const input = document.getElementById("address");
  const autocomplete = new google.maps.places.Autocomplete(input);
  autocomplete.addListener("place_changed", () => {
    selectedPlace = autocomplete.getPlace();
  });
}
window.onload = initAutocomplete;

function goToMap() {
  if (!selectedPlace || !selectedPlace.geometry) { alert("Please select an address."); return; }
  document.getElementById("step1").style.display = "none";
  document.getElementById("map").style.display = "block";
  document.getElementById("loader").style.display = "flex";
  initMap();
}

function initMap() {
  const userLoc = selectedPlace.geometry.location;
  map = new google.maps.Map(document.getElementById("map"), {
    center: userLoc, zoom: 12, disableDefaultUI: true, zoomControl: true
  });

  map.addListener("click", closePanel);

  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      document.getElementById("loader").style.display = "none";
      data.forEach(loc => {
        const circle = new google.maps.Circle({
          strokeColor: "#FF0000", 
          fillColor: "#FF0000", 
          strokeWeight: 1,
          fillOpacity: 0.3,
          map: map, 
          center: { 
            lat: parseFloat(loc.lat), 
            lng: parseFloat(loc.lng) 
          }, 
          radius: 1000
        });
        circle.addListener("click", (e) => { if (e.stop) e.stop(); openPanel(loc); });
      });
    });
}

function openPanel(loc) {
  const infoEl = document.getElementById("infoText");
  const btnEl = document.getElementById("toggleBtn");
  
  document.getElementById("panel").style.display = "block";
  document.getElementById("groupPhoto").src = loc.photo || "https://via.placeholder.com/400x200?text=No+Photo";
  document.getElementById("title").innerText = loc.name;
  
  infoEl.innerText = loc.description || "No additional info provided.";
  
  // Reset state
  infoEl.classList.remove("expanded");
  btnEl.innerText = "Read more";
  
  // Optional: Hide button if text is very short (less than 4 lines)
  // This helps keep the UI clean for short descriptions
  if (infoEl.innerText.length < 100) {
    btnEl.style.display = "none";
  } else {
    btnEl.style.display = "block";
  }

  document.getElementById("refLink").href = loc.link || "#";
}

function toggleInfo() {
  const info = document.getElementById("infoText");
  const btn = document.getElementById("toggleBtn");
  
  info.classList.toggle("expanded");
  
  // Switch button text based on state
  if (info.classList.contains("expanded")) {
    btn.innerText = "Read less";
  } else {
    btn.innerText = "Read more";
  }
}

function closePanel() { document.getElementById("panel").style.display = "none"; }
</script>
</body>
</html>
